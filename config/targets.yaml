# =============================================================================
# İZLENECEK BANKA KAMPANYA SAYFALARI
# =============================================================================
# Bir bankayı takip etmek istemiyorsan altındaki  enabled: true  satırını
# enabled: false  yap. Silmene gerek yok.
# =============================================================================

targets:

