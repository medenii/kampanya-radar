name: Daily Campaign Check

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "E-posta gönderme, sadece test et"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: campaign-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repoyu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıklar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Playwright Chromium kur
        run: python -m playwright install --with-deps chromium

      - name: Agent'ı çalıştır
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.0-flash' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM_NAME: "Kampanya Radar"
          PYTHONUNBUFFERED: "1"
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python -m src.main --dry-run --debug
          else
            python -m src.main
          fi

      - name: State'i commit'le (hafıza kalıcılığı)
        if: always() && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          if git diff --staged --quiet; then
            echo "State değişmedi, commit yok."
          else
            git commit -m "chore(state): $(date -u +'%Y-%m-%d %H:%M') güncellemesi [skip ci]"
            git pull --rebase --autostash origin ${{ github.ref_name }} || git rebase --abort
            git push
          fi

      - name: Hata durumunda log'u sakla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs
          path: |
            data/
          retention-days: 7
