  - name: "Garanti BBVA"
    url: "https://www.garantibbva.com.tr/kampanyalar"
    include_patterns:
      - "/kampanyalar/"
    exclude_patterns:
      - "/kampanyalar/?$"
      - "/arsiv"
      - "/gecmis"
    wait_ms: 3000
    scroll: true
    detail: true
    enabled: true

